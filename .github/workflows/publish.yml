# Publica o pacote zormy no npm: atualiza versão, faz build, publica e dá git push.
# Acionado manualmente (workflow_dispatch) ou ao criar uma tag v*.
#
# Configuração no repositório:
# - Secret NPM_TOKEN: token de acesso do npm (npmjs.com) com permissão de publish.
#   Criar em: https://www.npmjs.com/settings/~/tokens (Automation ou Publish).
name: Publish zormy to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de bump da versão"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "20"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          cd packages/zormy && npm version ${{ inputs.bump }} --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Set version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          NEW_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          export NEW_VERSION
          node -e "
          const fs = require('fs');
          const p = require('./packages/zormy/package.json');
          p.version = process.env.NEW_VERSION;
          fs.writeFileSync('./packages/zormy/package.json', JSON.stringify(p, null, 2));
          "

      - name: Update lockfile after version bump
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Configure npm for publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      - name: Publish to npm
        run: pnpm --filter zormy publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push (manual trigger)
        if: github.event_name == 'workflow_dispatch' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/zormy/package.json pnpm-lock.yaml
          git diff --staged --quiet || git commit -m "chore(release): zormy@${{ env.NEW_VERSION }}"
          git push
          git tag "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"
